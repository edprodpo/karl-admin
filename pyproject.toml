[project]
name = "karl-vk-django"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4"
package-mode = false
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "django-environ (>=0.13.0,<0.14.0)",
    "django-ninja (>=1.6.2,<2.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "punq (>=0.7.0,<0.8.0)",
    "django-jazzmin (>=3.0.4,<4.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "gunicorn (>=25.3.0,<26.0.0)",
    "orjson (>=3.11.8,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "faker (>=40.12.0,<41.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.project.settings.local"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 120
lines_after_imports = 2
lines_between_sections = 1
lines_between_types = 0
force_alphabetical_sort_within_sections = true
ensure_newline_before_comments = true
combine_as_imports = true
combine_star = true
skip_gitignore = true
balanced_wrapping = true
force_grid_wrap = 2
src_paths=["core", ]
skip_glob=[
    ".git",
    ".idea",
    ".vscode",
    "venv",
    ".venv",
]
known_django=["django","ninja"]
known_first_party=["core"]
sections=[
    "FUTURE",
    "STDLIB",
    "DJANGO",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
