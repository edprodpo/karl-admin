services:
  karl-vk-admin:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: karl-vk-admin
    ports: 
      - "${DJANGO_PORT:-8000}:${DJANGO_PORT:-8000}"
    command: > 
      gunicorn core.project.wsgi:application
      --bind 0.0.0.0:${DJANGO_PORT:-8000}
      --workers 2
      --worker-class gthread
      --threads 2
      --max-requests 100
      --max-requests-jitter 20
      --timeout 60
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
      --capture-output
      --log-level debug
    env_file:
      - ../.env
    volumes:
      - ..:/app/